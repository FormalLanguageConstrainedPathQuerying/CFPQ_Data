repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: requirements-txt-fixer
  - repo: https://github.com/psf/black
    rev: 22.10.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: check-version-sync
        name: Check config.py and pyproject.toml versions match
        entry: python3 utils/check_version_sync.py
        language: system
        pass_filenames: false
        always_run: true
