name: Code coverage

on: [ push, pull_request ]

jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Why these flags: see "Development setup" in docs/developer.rst.
      - name: Install dependencies with uv
        run: uv sync --frozen --all-groups

      - name: Show installed packages
        run: uv tree

      # Per-metric gate rationale: see "Test pipeline" in docs/developer.rst.
      # term-missing keeps the uncovered lines in the CI log.
      - name: Test CFPQ_Data with coverage (line and branch >= 95%)
        run: uv run pytest --cov=flpq_data --cov-report=term-missing --cov-report=json && uv run python utils/check_coverage.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
