name: Code coverage

on: [ push, pull_request ]

jobs:
  report:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      # --frozen fails if uv.lock is out of sync with pyproject.toml.
      - name: Install dependencies with uv
        run: uv sync --frozen --only-group test

      - name: Show installed packages
        run: uv tree

      - name: Test CFPQ_Data with coverage
        run: uv run pytest --cov=cfpq_data

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
