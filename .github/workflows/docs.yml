name: Docs build check

on: [ push, pull_request ]

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Why these flags: see "Development setup" in docs/developer.rst.
      - name: Install dependencies with uv
        run: uv sync --frozen --all-groups

      - name: Show installed packages
        run: uv tree

      # No-warnings policy: see "Docs build and deploy" in docs/developer.rst.
      - name: Build
        run: uv run make -C docs/ html

      # Link check policy: see "Docs build and deploy" in docs/developer.rst.
      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
