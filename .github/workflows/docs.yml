name: Docs build check

on: [ push, pull_request ]

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pip install poetry

      - name: Install dependencies with Poetry
        run: |
          poetry install --no-interaction --no-ansi --with docs

      - name: Show installed packages
        run: poetry show

      - name: Install packages
        run: poetry run pip install .

      # No-warnings policy: the build runs with -W --keep-going (see
      # docs/Makefile), so any warning — including an unresolved
      # cross-reference under nitpicky — exits non-zero on its own.
      - name: Build
        run: poetry run make -C docs/ html

      # The linkcheck builder exits non-zero on broken or timed-out links.
      - name: Check links
        run: poetry run sphinx-build -b linkcheck docs docs/_build/linkcheck
