name: Docs build check

on: [ push, pull_request ]

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      # --frozen fails if uv.lock is out of sync with pyproject.toml.
      - name: Install dependencies with uv
        run: uv sync --frozen --only-group docs

      - name: Show installed packages
        run: uv tree

      # No-warnings policy: the build runs with -W --keep-going (see
      # docs/Makefile), so any warning — including an unresolved
      # cross-reference under nitpicky — exits non-zero on its own.
      - name: Build
        run: uv run make -C docs/ html

      # The linkcheck builder exits non-zero on broken or timed-out links.
      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
