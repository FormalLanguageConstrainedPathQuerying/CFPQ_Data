name: Publish

on:
  push:
    tags: ['v*']
  # Packaging check for every PR targeting the release branch: build the
  # sdist/wheel and publish to TestPyPI before a release tag is cut.
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          ver=$(python3 -c "import sys; sys.path.insert(0, 'utils'); import check_version_sync as c; print(c.config_version())")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${ver}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version ${ver}"

      - name: Build distributions
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # Concurrent PRs share the same package version and TestPyPI
          # rejects re-uploads of existing files; skip instead of failing.
          skip-existing: true

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password`: uses OIDC Trusted Publishing (configured once on PyPI).
        # Fallback if not using Trusted Publishing: set the PYPI_API_TOKEN
        # secret and uncomment the `with` block below.
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 {insec=1; next}
            /^## / && insec {exit}
            insec {print}
          ' CHANGELOG.md > release_notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md dist/*
