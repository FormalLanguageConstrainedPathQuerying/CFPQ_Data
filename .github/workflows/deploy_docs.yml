name: Deploy docs

on:
  push:
    branches: [ master ]

jobs:
  documentation:
    # Do not attempt to deploy documentation on forks
    if: github.repository_owner == 'FormalLanguageConstrainedPathQuerying'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11 ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # --frozen fails if uv.lock is out of sync with pyproject.toml;
      # --all-groups installs the full environment so every check resolves
      # imports from any dependency group (ty/pyright type-check tests/,
      # docs/conf.py and utils/, which import pytest, sphinx and boto3).
      - name: Install dependencies with uv
        run: uv sync --frozen --all-groups

      - name: Show installed packages
        run: uv tree

      - name: Build
        run: uv run make -C docs/ html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: docs/_build/html # The folder the action should deploy.
